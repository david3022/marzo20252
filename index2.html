    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const carrusel1 = document.querySelector(".carrusel-1 .carrusel-items");
            const maxScrollLeft1 = carrusel1.scrollWidth - carrusel1.clientWidth;
            let step1 = 1;
            let intervalo1;

            const startCarrusel1 = () => {
                intervalo1 = setInterval(() => {
                    carrusel1.scrollLeft += step1;

                    if (carrusel1.scrollLeft >= maxScrollLeft1) {
                        carrusel1.scrollLeft = 0; // Reiniciar al inicio
                    }
                }, 10);
            };

            const stopCarrusel1 = () => {
                clearInterval(intervalo1);
            };

            carrusel1.addEventListener("mouseover", stopCarrusel1);
            carrusel1.addEventListener("mouseout", startCarrusel1);

            startCarrusel1();
        });


        // ----------------------------------------------------------------------------------------------------------


        document.addEventListener("DOMContentLoaded", () => {
            const carrusel2 = document.querySelector(".carrusel-2 .carrusel-items");
            const maxScrollLeft2 = carrusel2.scrollWidth - carrusel2.clientWidth;
            let step2 = -1;
            let intervalo2;

            const startCarrusel2 = () => {
                intervalo2 = setInterval(() => {
                    carrusel2.scrollLeft += step2;

                    if (carrusel2.scrollLeft <= 0) {
                        carrusel2.scrollLeft = maxScrollLeft2; // Reiniciar al final
                    }
                }, 10);
            };

            const stopCarrusel2 = () => {
                clearInterval(intervalo2);
            };

            carrusel2.addEventListener("mouseover", stopCarrusel2);
            carrusel2.addEventListener("mouseout", startCarrusel2);

            startCarrusel2();
        });

    </script>
